<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planet Jumping — Immersive Space Portal</title>
  <style>
    /* ====================================================================
       2. FONTS
       ==================================================================== */
    @font-face {
      font-family: 'SF Pro';
      font-weight: 400;
      src: local('SF Pro'), local('SF Pro Text'), local('-apple-system'), local('BlinkMacSystemFont');
    }
    @font-face {
      font-family: 'SF Pro';
      font-weight: 700;
      src: local('SF Pro Bold'), local('SF Pro Text Bold');
    }
    @font-face {
      font-family: 'SF Pro Thin';
      font-weight: 100;
      src: local('SF Pro Thin'), local('SF Pro Text Thin');
    }
    @font-face {
      font-family: 'Aalto';
      font-weight: 400;
      src: local('Aalto');
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }

    /* ====================================================================
       5. LAYOUT CSS (exact values)
       ==================================================================== */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090807; }
    .experience { position: relative; width: 100%; height: 100%; min-height: 540px; overflow: hidden; background: #0a0908; }
    .backgrounds, .background, .shade, .transition-layer, .transition-layer video { position: absolute; inset: 0; width: 100%; height: 100%; }
    .background { object-fit: cover; opacity: 0; transition: opacity .8s ease; }
    .background.is-visible { opacity: 1; }
    .shade { z-index: 1; background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.88) 100%); pointer-events: none; }
    .chrome { position: absolute; z-index: 4; transition: opacity .45s ease, filter .45s ease; }
    .experience.is-transitioning .chrome { opacity: 0; filter: blur(8px); pointer-events: none; }

    /* HEADER */
    .header { left: clamp(18px, 1.95vw, 28px); right: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); display: flex; justify-content: space-between; align-items: center; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .nav { display: flex; align-items: center; height: 42px; padding: 4px 5px; border: 1px solid rgba(255,255,255,.45);
           background: rgba(255,255,255,.1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 999px; }
    .nav a { color: #fff; text-decoration: none; padding: 8px 19px; border-radius: 999px; line-height: 1; font-size: 14px; font-weight: 400; }
    .nav a.active { background: #fff; color: #000; font-weight: 700; }
    .menu { height: 42px; padding: 0 20px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; }

    /* SIDEBAR */
    .planet-list { left: clamp(18px, 1.95vw, 28px); top: 50%; transform: translateY(-43%); display: flex; flex-direction: column; gap: 6px; font-size: 16px; user-select: none; }
    .planet-item { display: flex; align-items: center; min-height: 20px; color: rgba(255,255,255,.6); transition: color .3s ease; }
    .planet-item.active { font-size: 18px; font-weight: 700; gap: 8px; color: #fff; }
    .planet-item.active:before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: #fff; display: inline-block; flex-shrink: 0; }

    /* PORTAL */
    .portal-wrap { left: 50%; top: 50%; width: min(320px, 31vw); transform: translate(-50%, -54%); perspective: none; }
    .portal-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; opacity: 0; color: #fff; }
    .portal-heading strong { font-size: 18px; margin-left: 8px; }
    .portal { position: relative; display: block; width: 100%; aspect-ratio: 320/350; padding: 0; overflow: visible; border: 0;
            border-radius: 90px; background: transparent; cursor: pointer; box-shadow: none; transform: none !important; }
    .portal video, .portal img { visibility: hidden; position: absolute; width: 1px; height: 1px; pointer-events: none; }
    .portal-canvas { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }

    /* CONTENT */
    .planet-content { left: clamp(28px, 4vw, 58px); right: clamp(28px, 3vw, 44px); bottom: clamp(24px, 3vh, 30px);
                      display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; pointer-events: none; }
    .planet-content h1 { font-family: Aalto, 'Arial Narrow', sans-serif; font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400; line-height: .72; margin: 0 0 -.04em; letter-spacing: 0; transform: translateX(-32px); opacity: 0; color: #fff; text-transform: uppercase; }
    .planet-content dl { width: min(447px, 34vw); margin: 0; font-size: 16px; pointer-events: auto; }
    .fact { display: grid; grid-template-columns: 138px 1fr; gap: 18px; padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,.48); opacity: 0; }
    .fact:last-child { border-bottom: 0; }
    .fact dt { font-weight: 700; color: #fff; }
    .fact dd { margin: 0; color: rgba(255,255,255,.85); }

    /* MISC */
    .transition-layer { display: none; }
    .scene-canvas { display: none; }
    .loading { position: absolute; z-index: 12; left: 50%; bottom: 30px; transform: translateX(-50%); opacity: 0;
               font-size: 12px; letter-spacing: .14em; text-transform: uppercase; transition: opacity .2s; color: #fff; }
    .experience.is-loading .loading { opacity: .8; }
    .experience.is-transitioning .header, .experience.is-transitioning .planet-list { opacity: 1; filter: none; pointer-events: auto; }
    .experience.is-transitioning .shade { opacity: 1; }
    .experience.is-committing .background { transition: none !important; }

    /* ====================================================================
       6. PRELOADER
       ==================================================================== */
    .preloader { position: absolute; inset: 0; z-index: 20; background: #000; overflow: hidden; }
    .preloader video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .preloader-shade { position: absolute; inset: auto 0 0; height: 35%; background: linear-gradient(to bottom, transparent, #000); }
    .preloader.is-background { z-index: 0; }
    .preloader.is-background .preloader-shade { opacity: 0; }
    .floating-logo { position: fixed; z-index: 22; left: 50%; top: 50%; width: 59px; height: 58px; transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(.16, 1, .3, 1), top 2s cubic-bezier(.16, 1, .3, 1), width 2s cubic-bezier(.16, 1, .3, 1), height 2s cubic-bezier(.16, 1, .3, 1), transform 2s cubic-bezier(.16, 1, .3, 1); }
    .floating-logo.is-docked { left: clamp(18px, 1.95vw, 28px); top: clamp(18px, 3.1vh, 28px); width: 37px; height: 36px; transform: none; }
    .floating-logo.is-settled { z-index: 5; }
    .preloader-count { position: fixed; z-index: 22; left: 50%; bottom: clamp(22px, 3.1vh, 28px); display: flex; align-items: flex-end;
      gap: 4px; transform: translateX(-50%); font-family: 'SF Pro', Arial, sans-serif; line-height: 1; color: #fff; }
    .preloader-count > span:first-child { font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif; font-size: 64px; font-weight: 100; }
    .preloader-count .percent { font-size: 24px; padding-bottom: 4px; }
    .preloader-count.is-leaving { animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes preload-count-out { to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); } }
    body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

    /* ====================================================================
       9. CUSTOM CURSOR
       ==================================================================== */
    html, body, button, a, .portal { cursor: none !important; }
    .custom-cursor { display: block; position: fixed; left: 0; top: 0; z-index: 100; width: 1px; height: 1px;
      pointer-events: none; opacity: 0; transition: opacity .2s ease; }
    .custom-cursor.is-visible { opacity: 1; }
    .cursor-dot, .cursor-orbit { position: absolute; left: 0; top: 0; border-radius: 50%; transform: translate(-50%, -50%); }
    .cursor-dot { width: 12px; height: 12px; background: #fff; }
    .cursor-orbit { width: 36px; height: 36px; border: 1px solid #fff; background: rgba(255, 255, 255, .4);
      transition: transform .3s cubic-bezier(.22, 1, .36, 1); }
    .custom-cursor.is-enter .cursor-orbit { transform: translate(-50%, -50%) scale(1.16); }
    .cursor-label { position: absolute; top: 26px; left: 0; transform: translateX(-50%) translateY(-4px);
      font: 16px/1.2 'SF Pro', Arial, sans-serif; white-space: nowrap; opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1); color: #fff; }
    .custom-cursor.is-enter .cursor-label { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ====================================================================
       10. ENTRANCE / SWITCH ANIMATIONS
       ==================================================================== */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact { opacity: 0; }

    .intro-ready .header       { animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both; }
    .intro-ready .planet-list  { animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both; }
    .content-revealing h1      { animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both; }
    .content-revealing .fact   { animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both; }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

    .mask-revealing .portal-heading { animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both; }

    .planet-list.is-switching .planet-item { animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both; }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }

    .planet-list.is-switching .planet-item.active:before { animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both; }

    @keyframes reveal-down   { from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }      to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes reveal-side   { from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }  to { opacity: 1; filter: blur(0); transform: translate(0, -43%); } }
    @keyframes title-rise    { from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); } to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); } }
    @keyframes fact-rise     { from { opacity: 0; filter: blur(7px); transform: translateY(18px); }       to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes portal-caption{ from { opacity: 0; filter: blur(7px); transform: translateY(22px); }       to { opacity: 1; filter: blur(0); transform: translateY(0); } }
    @keyframes menu-row      { from { opacity: .35; transform: translateX(-8px); }                         to { opacity: 1; transform: translateX(0); } }
    @keyframes active-dot    { from { opacity: 0; transform: scale(0); }                                   to { opacity: 1; transform: scale(1); } }

    /* ====================================================================
       11. RESPONSIVE
       ==================================================================== */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>
  <!-- ====================================================================
       3. DOM STRUCTURE (exact ids/classes — the JS depends on them)
       ==================================================================== -->
  <main class="experience" data-planet="mars">
    <div class="backgrounds" aria-hidden="true">
      <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
      <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
    </div>
    <div class="preloader" id="preloader" aria-label="Loading Mars">
      <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>
      <div class="preloader-shade"></div>
    </div>
    <img class="floating-logo" id="floating-logo" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg" alt="Ubernatural">
    <div class="preloader-count" id="preloader-count" aria-live="polite">
      <span id="preloader-value">0</span><span class="percent">%</span>
    </div>
    <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="header chrome">
      <div class="header-actions">
        <nav class="nav" aria-label="Primary navigation">
          <a class="active" href="#about">About</a><a href="#explore">Explore</a><a href="#planets">Planets</a>
        </nav>
        <button class="menu" type="button">Menu</button>
      </div>
    </header>

    <aside class="planet-list chrome" aria-label="Planets"></aside>   <!-- JS-filled -->

    <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
    <section class="portal-wrap chrome" aria-label="Next destination">
      <div class="portal-heading">
        <span>Next:</span>
        <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
      </div>
      <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
        <video id="portal-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
        <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury">
      </button>
    </section>

    <section class="planet-content chrome" aria-live="polite">
      <h1 id="planet-title">MARS</h1>
      <dl id="facts"></dl>                                           <!-- JS-filled -->
    </section>

    <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto"></video></div>
    <div class="loading" aria-hidden="true">Preparing orbit…</div>
    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-orbit"></span><span class="cursor-dot"></span><span class="cursor-label">Enter</span>
    </div>
  </main>

  <script>
    /* ====================================================================
       1. REMOTE ASSETS
       ==================================================================== */
    const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
    const MARS_BG   = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
    const TO_EARTH  = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
    const TO_VENUS  = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
    const TO_MARS   = `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
    const MERCURY   = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;
    const LOGO      = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

    /* ====================================================================
       4. DATA MODEL
       ==================================================================== */
    const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

    const states = {
      mars: {
        name: 'Mars',
        next: 'Earth',
        number: '[03]',
        portal: TO_EARTH,
        background: 'mars-background',
        facts: [
          ['Distance:', 'About 228 million km (1.5 astronomical units).'],
          ['Year:', 'One Martian year is equal to 687 Earth days.'],
          ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
          ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
        ]
      },
      earth: {
        name: 'Earth',
        next: 'Venus',
        number: '[02]',
        portal: TO_VENUS,
        background: 'earth-background',
        facts: [
          ['Distance:', '149.6 million km from the Sun.'],
          ['Year:', '365.25 Earth days.'],
          ['Temperature:', 'Average surface temperature around 15 °C.'],
          ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
        ]
      },
      venus: {
        name: 'Venus',
        next: 'Mercury',
        number: '[06]',
        image: MERCURY,
        background: 'venus-background',
        facts: [
          ['Distance:', '108.2 million km from the Sun.'],
          ['Year:', '225 Earth days.'],
          ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
          ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
        ]
      }
    };

    // State Variables
    let current = 'mars';
    let busy = false;
    let transitionActive = false;
    let hasFrozenScene = false;
    let isFirstRender = true;
    let expansion = 0;
    let maskScale = 1;
    let canvasOpacity = 1;

    // Tilt & Physics
    let targetX = 0;
    let targetY = 0;
    let rotX = 0;
    let rotY = 0;
    let lastFrameTime = performance.now();

    // DOM Elements
    const experienceEl = document.querySelector('.experience');
    const portalCanvas = document.getElementById('portal-canvas');
    const sceneCanvas = document.getElementById('scene-canvas');
    const ctx = portalCanvas.getContext('2d');
    const sceneCtx = sceneCanvas.getContext('2d');

    const portalBtn = document.getElementById('portal');
    const portalVideo = document.getElementById('portal-video');
    const portalImage = document.getElementById('portal-image');
    const transitionVideo = document.getElementById('transition-video');

    const planetTitleEl = document.getElementById('planet-title');
    const nextNameEl = document.getElementById('next-name');
    const nextNumberEl = document.getElementById('next-number');
    const factsEl = document.getElementById('facts');
    const planetListEl = document.querySelector('.planet-list');

    const preloaderEl = document.getElementById('preloader');
    const preloaderVideo = document.getElementById('preloader-video');
    const preloaderCountEl = document.getElementById('preloader-count');
    const preloaderValueEl = document.getElementById('preloader-value');
    const floatingLogoEl = document.getElementById('floating-logo');
    const customCursorEl = document.querySelector('.custom-cursor');
    const backgroundVideos = document.querySelectorAll('.background');

    /* ====================================================================
       8. EASING & VALUE ANIMATION
       ==================================================================== */
    const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    function animateValue(setter, duration) {
      return new Promise(resolve => {
        const start = performance.now();
        function tick(now) {
          const elapsed = now - start;
          const t = Math.min(1, elapsed / duration);
          setter(easeInOutCubic(t));
          if (t < 1) {
            requestAnimationFrame(tick);
          } else {
            setter(1);
            resolve();
          }
        }
        requestAnimationFrame(tick);
      });
    }

    /* ====================================================================
       4. RENDER
       ==================================================================== */
    function render() {
      const state = states[current];
      experienceEl.dataset.planet = current;
      planetTitleEl.textContent = state.name.toUpperCase();
      nextNameEl.textContent = state.next;
      nextNumberEl.textContent = state.number;
      portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

      // Facts list
      factsEl.innerHTML = state.facts
        .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
        .join('');

      // Planets sidebar
      planetListEl.innerHTML = planets
        .map(p => `<span class="planet-item${p.toLowerCase() === current ? ' active' : ''}">${p}</span>`)
        .join('');

      if (!isFirstRender) {
        planetListEl.classList.remove('is-switching');
        void planetListEl.offsetWidth; // force reflow
        planetListEl.classList.add('is-switching');
      }

      // Background video toggle
      backgroundVideos.forEach(bg => {
        if (bg.id === state.background) {
          bg.classList.add('is-visible');
          bg.loop = true;
          bg.play().catch(() => {});
        } else {
          bg.classList.remove('is-visible');
          bg.pause();
        }
      });

      // Portal media
      if (state.image) {
        portalImage.style.display = 'block';
        portalVideo.style.display = 'none';
        portalVideo.pause();
      } else {
        portalImage.style.display = 'none';
        portalVideo.style.display = 'block';
        if (portalVideo.src !== state.portal) {
          portalVideo.src = state.portal;
          portalVideo.load();
        }
        portalVideo.loop = true;
        portalVideo.play().catch(() => {});
      }

      isFirstRender = false;
    }

    /* ====================================================================
       7. THE PORTAL — CANVAS MASK WITH FAKE 3D
       ==================================================================== */
    function resizeCanvas() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      portalCanvas.width = window.innerWidth * d;
      portalCanvas.height = window.innerHeight * d;
      portalCanvas.style.width = window.innerWidth + 'px';
      portalCanvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(d, 0, 0, d, 0, 0);

      if (!hasFrozenScene) {
        sceneCanvas.width = window.innerWidth * d;
        sceneCanvas.height = window.innerHeight * d;
        sceneCanvas.style.width = window.innerWidth + 'px';
        sceneCanvas.style.height = window.innerHeight + 'px';
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
      }
    }
    window.addEventListener('resize', resizeCanvas);

    function drawCover(media, targetCtx = ctx) {
      if (!media) return;
      const mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
      const mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
      if (!mw || !mh) return;
      const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
      const w = mw * scale;
      const h = mh * scale;
      const x = (window.innerWidth - w) / 2;
      const y = (window.innerHeight - h) / 2;
      targetCtx.drawImage(media, x, y, w, h);
    }

    function drawShade(targetCtx = ctx) {
      const yStart = window.innerHeight * 0.52;
      const yEnd = window.innerHeight;
      const grad = targetCtx.createLinearGradient(0, yStart, 0, yEnd);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.88)');
      targetCtx.fillStyle = grad;
      targetCtx.fillRect(0, yStart, window.innerWidth, yEnd - yStart);
    }

    function getRoundedRectPoints(w, h, r) {
      const maxR = Math.min(w / 2, h / 2);
      const cr = Math.max(0, Math.min(r, maxR));
      const corners = [
        { cx:  w / 2 - cr, cy: -h / 2 + cr, a0: -Math.PI / 2, a1: 0 },
        { cx:  w / 2 - cr, cy:  h / 2 - cr, a0: 0,            a1: Math.PI / 2 },
        { cx: -w / 2 + cr, cy:  h / 2 - cr, a0: Math.PI / 2,  a1: Math.PI },
        { cx: -w / 2 + cr, cy: -h / 2 + cr, a0: Math.PI,       a1: Math.PI * 1.5 }
      ];
      const points = [];
      for (let c = 0; c < 4; c++) {
        const { cx, cy, a0, a1 } = corners[c];
        for (let i = 0; i <= 10; i++) {
          const a = a0 + (a1 - a0) * (i / 10);
          points.push([cx + cr * Math.cos(a), cy + cr * Math.sin(a)]);
        }
      }
      return points;
    }

    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (hasFrozenScene) {
        ctx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
        drawShade(ctx);
      }

      const rect = portalBtn.getBoundingClientRect();
      const e = expansion; // 0..1
      const rectCx = rect.left + rect.width / 2;
      const rectCy = rect.top + rect.height / 2;
      const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
      const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
      const baseW = rect.width + (window.innerWidth - rect.width) * e;
      const baseH = rect.height + (window.innerHeight - rect.height) * e;
      const scale = e ? 1 : maskScale;
      const w = baseW * scale;
      const h = baseH * scale;
      const r = 90 * (1 - e) * scale;
      const rx = rotX * (1 - e);
      const ry = rotY * (1 - e);

      if (w > 1 && h > 1) {
        const pts = getRoundedRectPoints(w, h, r);
        const ax = (rx * Math.PI) / 180;
        const ay = (ry * Math.PI) / 180;
        const cosAx = Math.cos(ax);
        const sinAx = Math.sin(ax);
        const cosAy = Math.cos(ay);
        const sinAy = Math.sin(ay);

        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const x = pts[i][0];
          const y = pts[i][1];
          const xx = x * cosAy;
          const yy = y * cosAx;
          const z = x * sinAy - y * sinAx;
          const p = 850 / (850 + z);
          const sx = cx + xx * p;
          const sy = cy + yy * p;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();

        ctx.save();
        ctx.globalAlpha = canvasOpacity;
        ctx.clip();
        ctx.fillStyle = '#030303';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const media = transitionActive
          ? transitionVideo
          : (states[current].image ? portalImage : portalVideo);

        drawCover(media, ctx);

        if (transitionActive) {
          drawShade(ctx);
        }
        ctx.restore();
      }

      // Physics integration (dt clamped to 40ms)
      const now = performance.now();
      const dt = Math.min(40, now - lastFrameTime);
      lastFrameTime = now;
      rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
      rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

      requestAnimationFrame(draw);
    }

    // Pointer tilt listener
    window.addEventListener('pointermove', e => {
      if (busy) return;
      targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
      targetX = (e.clientY / window.innerHeight - 0.5) * -33;
    });

    document.addEventListener('pointerleave', () => {
      targetX = 0;
      targetY = 0;
    });

    /* ====================================================================
       8. TRAVEL TRANSITION
       ==================================================================== */
    async function travel() {
      if (busy || current === 'venus') return;
      busy = true;
      targetX = 0;
      targetY = 0;

      const next = current === 'mars' ? 'earth' : 'venus';

      try {
        transitionVideo.src = states[current].portal;
        transitionVideo.load();
        experienceEl.classList.add('is-loading');

        // Await canplaythrough or error or 1600ms timeout
        await new Promise(resolve => {
          let resolved = false;
          const finishWait = () => {
            if (!resolved) {
              resolved = true;
              transitionVideo.removeEventListener('canplaythrough', finishWait);
              transitionVideo.removeEventListener('canplay', finishWait);
              transitionVideo.removeEventListener('error', finishWait);
              clearTimeout(timer);
              resolve();
            }
          };
          transitionVideo.addEventListener('canplaythrough', finishWait);
          transitionVideo.addEventListener('canplay', finishWait);
          transitionVideo.addEventListener('error', finishWait);
          const timer = setTimeout(finishWait, 1600);
          if (transitionVideo.readyState >= 3) finishWait();
        });

        experienceEl.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
        experienceEl.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;
        try {
          await transitionVideo.play();
        } catch (e) {
          console.warn("Transition video play:", e);
        }

        await animateValue(v => { expansion = v; }, 1100);

        // Await video 'ended'
        await new Promise(resolve => {
          let resolved = false;
          const onEnded = () => {
            if (!resolved) {
              resolved = true;
              transitionVideo.removeEventListener('ended', onEnded);
              clearTimeout(timer);
              resolve();
            }
          };
          transitionVideo.addEventListener('ended', onEnded);
          const dur = transitionVideo.duration || 3;
          const remaining = Math.max(1200, ((dur - transitionVideo.currentTime) / 1.3) * 1000 + 600);
          const timer = setTimeout(onEnded, remaining);
        });

        // Freeze final frame into #scene-canvas
        const d = Math.min(window.devicePixelRatio || 1, 2);
        sceneCanvas.width = window.innerWidth * d;
        sceneCanvas.height = window.innerHeight * d;
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
        sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCover(transitionVideo, sceneCtx);
        hasFrozenScene = true;

        current = next;
        experienceEl.classList.add('is-committing');
        render();

        // Await two rAFs
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        transitionActive = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;
        experienceEl.classList.remove('is-transitioning', 'is-committing');

        const maskReveal = revealMask();
        setTimeout(() => revealPlanetContent(), 100);
        await maskReveal;
        hasFrozenScene = false;

        setTimeout(() => {
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
          busy = false;
        }, 450);

      } catch (err) {
        console.error("Travel exception:", err);
        transitionActive = false;
        expansion = 0;
        maskScale = 1;
        canvasOpacity = 1;
        hasFrozenScene = false;
        experienceEl.classList.remove('is-loading', 'is-transitioning', 'is-committing');
        busy = false;
      }
    }

    function revealMask() {
      experienceEl.classList.remove('mask-revealing');
      void experienceEl.offsetWidth; // force reflow
      experienceEl.classList.add('mask-revealing');
      maskScale = 0;
      return animateValue(v => { maskScale = v; }, 1050);
    }

    function revealPlanetContent() {
      experienceEl.classList.remove('content-revealing');
      void experienceEl.offsetWidth; // force reflow
      experienceEl.classList.add('content-revealing');
    }

    portalBtn.addEventListener('click', e => {
      e.preventDefault();
      travel();
    });

    /* ====================================================================
       9. CUSTOM CURSOR
       ==================================================================== */
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let cursorVisible = false;

    window.addEventListener('pointermove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!cursorVisible) {
        cursorVisible = true;
        customCursorEl.classList.add('is-visible');
      }
    });

    document.addEventListener('mouseleave', () => {
      cursorVisible = false;
      customCursorEl.classList.remove('is-visible');
    });

    portalBtn.addEventListener('pointerenter', () => {
      customCursorEl.classList.add('is-enter');
    });

    portalBtn.addEventListener('pointerleave', () => {
      customCursorEl.classList.remove('is-enter');
    });

    function cursorLoop() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      customCursorEl.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
      requestAnimationFrame(cursorLoop);
    }

    /* ====================================================================
       6. PRELOADER & START EXPERIENCE
       ==================================================================== */
    let preloaderFinished = false;

    function finishPreloader() {
      if (preloaderFinished) return;
      preloaderFinished = true;

      preloaderValueEl.textContent = '100';
      preloaderCountEl.classList.add('is-leaving');
      floatingLogoEl.classList.add('is-docked');
      preloaderEl.classList.add('is-background');
      document.body.classList.add('preload-complete');

      startExperience();

      setTimeout(() => {
        preloaderCountEl.remove();
      }, 750);

      setTimeout(() => {
        floatingLogoEl.classList.add('is-settled');
      }, 2000);
    }

    function waitForMedia(media) {
      return new Promise(resolve => {
        if (!media) { resolve(); return; }
        if (media.tagName === 'IMG') {
          if (media.complete) { resolve(); return; }
          media.addEventListener('load', () => resolve(), { once: true });
          media.addEventListener('error', () => resolve(), { once: true });
        } else {
          if (media.readyState >= 2) { resolve(); return; }
          media.addEventListener('loadeddata', () => resolve(), { once: true });
          media.addEventListener('canplay', () => resolve(), { once: true });
          media.addEventListener('error', () => resolve(), { once: true });
        }
        setTimeout(resolve, 1500); // timeout guarantee
      });
    }

    async function startExperience() {
      const media = states[current].image ? portalImage : portalVideo;
      await waitForMedia(media);
      await revealMask();
      document.body.classList.add('intro-ready');
      setTimeout(() => {
        revealPlanetContent();
      }, 850);
    }

    function runPreloader() {
      let countRaf = null;

      function updateCount() {
        if (preloaderVideo.duration && preloaderVideo.duration > 0) {
          const pct = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
          preloaderValueEl.textContent = pct;
        }
        if (!preloaderFinished) {
          countRaf = requestAnimationFrame(updateCount);
        }
      }

      function startPlayback() {
        try {
          preloaderVideo.playbackRate = Math.max(0.25, (preloaderVideo.duration || 3) / 3);
          preloaderVideo.play()
            .then(() => {
              countRaf = requestAnimationFrame(updateCount);
            })
            .catch(err => {
              console.warn("Preloader play error:", err);
              finishPreloader();
            });
        } catch (err) {
          finishPreloader();
        }
      }

      if (preloaderVideo.readyState >= 1) {
        startPlayback();
      } else {
        preloaderVideo.addEventListener('loadedmetadata', startPlayback, { once: true });
      }

      preloaderVideo.addEventListener('ended', finishPreloader, { once: true });

      // Fallback timeout in case video does not finish
      setTimeout(() => {
        if (!preloaderFinished) finishPreloader();
      }, 4500);
    }

    /* ====================================================================
       12. BOOT ORDER (last lines of the script)
       ==================================================================== */
    backgroundVideos.forEach(bg => {
      bg.pause();
      bg.currentTime = 0;
    });

    resizeCanvas();
    render();
    requestAnimationFrame(draw);
    requestAnimationFrame(cursorLoop);
    runPreloader();
  </script>
</body>
</html>
